# Method choices used by the engine.
gwp_set: IPCC AR6 GWP100

# PACT Technical Specification 3.0.3 requires DQR values from 1 to 5; 1 is the best score.
dqr_scale:
  best: 1
  worst: 5

mass_balance:
  tolerance_share: 0.01 # unexplained mass allowed, as a share of product material inputs

allocation:
  scrap_recycling: cut_off # cut_off (no credit) or substitution
  substitution:
    burden_factor: PET_RESIN_RECYCLED
    avoided_factor: PET_RESIN_VIRGIN
  overhead_method: mass # mass or machine_hours
  overhead_step_id: OH
  overhead_machine_count: 5 # used by machine_hours only; representative value

# TfS PCF Guideline 3.0, 5.2.3: where quantitative data are available, they shall be included.
# So nothing is left out by default. If flow_share is raised, an item is left out only if it is
# below it on both mass and impact. PACT Methodology 3.0, 3.3.1.2 caps the total at 3%.
cut_off:
  flow_share: 0.0
  total_share: 0.03

factors:
  electricity: [EL_DE_GRID]
  transport:
    road: [HGV_TTW, HGV_WTT]
  scrap:
    incineration: [WASTE_INCIN_PET]

# Inside the boundary but not modelled, so reported with every result.
known_omissions:
  - Site heating (the routing data has no heating use)
  - Making the PE bag from LDPE resin
  - PET film stretching and heat-setting (film making is a proxy from extrusion electricity)
  - Coating the release liner (the liner is a proxy from paper and silicone)

# Checks on supplier PCFs before they replace a database value.
primary_data:
  plausibility_low: 0.2 # times the secondary value; outside this range a comment is mandatory
  plausibility_high: 5.0
  allowed_boundaries: [cradle-to-gate]
  example_ratio: 0.8 # the page's test example, as a share of the secondary value
  example_primary_share: 0.5 # the test example's stated primary share, also a test value
